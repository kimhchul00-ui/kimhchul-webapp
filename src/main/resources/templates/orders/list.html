<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-PENDING { background-color: #ffc107; color: #000; }
        .status-CONFIRMED { background-color: #17a2b8; color: #fff; }
        .status-SHIPPED { background-color: #007bff; color: #fff; }
        .status-DELIVERED { background-color: #28a745; color: #fff; }
        .status-CANCELLED { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>주문 관리</h1>
            <a href="/orders/new" class="btn btn-primary">새 주문 등록</a>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <form method="get" action="/orders" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">상태 필터</label>
                        <select name="status" class="form-select">
                            <option value="">전체</option>
                            <option value="PENDING">대기중</option>
                            <option value="CONFIRMED">확인됨</option>
                            <option value="SHIPPED">배송중</option>
                            <option value="DELIVERED">배송완료</option>
                            <option value="CANCELLED">취소됨</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">고객명 검색</label>
                        <input type="text" name="search" class="form-control" placeholder="고객명을 입력하세요">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-secondary w-100">검색</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>주문번호</th>
                            <th>고객명</th>
                            <th>이메일</th>
                            <th>주문일시</th>
                            <th>총 금액</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center">등록된 주문이 없습니다.</td>
                        </tr>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.orderNo}"></td>
                            <td th:text="${order.customerName}"></td>
                            <td th:text="${order.customerEmail}"></td>
                            <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                            <td>
                                <span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-info">상세</a>
                                <a th:href="@{/orders/{id}/edit(id=${order.id})}" class="btn btn-sm btn-warning">수정</a>
                                <form th:action="@{/orders/{id}/delete(id=${order.id})}" method="post" style="display: inline;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center mt-4 mb-3">
            <small class="text-muted">배포 버전: <span th:text="${appVersion}">dev</span></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
