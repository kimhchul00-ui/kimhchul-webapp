<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, "Apple SD Gothic Neo", sans-serif;
        }
        .header {
            background-color: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin: 0;
        }
        .order-section {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #000;
            box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.1);
        }
        .item-row {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .btn-add {
            background-color: #fff;
            border: 1px solid #d0d0d0;
            color: #333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-add:hover {
            background-color: #f8f8f8;
        }
        .btn-remove {
            background-color: #fff;
            border: 1px solid #d0d0d0;
            color: #666;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-remove:hover {
            background-color: #f8f8f8;
            color: #000;
        }
        .order-summary {
            background-color: #f8f9fa;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14px;
        }
        .summary-row.total {
            border-top: 2px solid #e5e5e5;
            margin-top: 15px;
            padding-top: 20px;
            font-size: 20px;
            font-weight: 700;
        }
        .btn-submit {
            background-color: #000;
            color: #fff;
            padding: 15px 40px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            width: 100%;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #333;
            color: #fff;
        }
        .required {
            color: #dc3545;
        }
        .btn-back {
            background-color: #fff;
            border: 1px solid #d0d0d0;
            color: #333;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn-back:hover {
            background-color: #f8f8f8;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="header-title">주문하기</h1>
                <a href="/" class="btn-back">🏠 홈</a>
            </div>
        </div>
    </div>

    <div class="container">
        <form th:action="@{/customer/orders}" th:object="${ord}" method="post" id="orderForm">
            <div class="order-section">
                <div class="section-title">주문자 정보</div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">이름 <span class="required">*</span></label>
                        <input type="text" class="form-control" th:field="*{customerName}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">이메일</label>
                        <input type="email" class="form-control" th:field="*{customerEmail}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">배송지 주소</label>
                    <textarea class="form-control" th:field="*{shippingAddress}" rows="3" placeholder="배송받을 주소를 입력해주세요"></textarea>
                </div>
            </div>

            <div class="order-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="section-title" style="margin-bottom: 0;">주문 상품</div>
                    <button type="button" class="btn btn-add" onclick="addItemRow()">+ 상품 추가</button>
                </div>
                <div id="itemsContainer">
                    <div th:each="item, iterStat : ${ord.ordItems}" class="item-row" th:data-index="${iterStat.index}">
                        <input type="hidden" th:field="*{ordItems[__${iterStat.index}__].id}">
                        <input type="hidden" th:if="${item.item != null}" th:name="|ordItems[${iterStat.index}].item.id|" th:value="${item.item.id}">
                        <input type="hidden" th:if="${item.uitem != null}" th:name="|ordItems[${iterStat.index}].uitem.id|" th:value="${item.uitem.id}">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">상품명 <span class="required">*</span></label>
                                <input type="text" class="form-control" th:field="*{ordItems[__${iterStat.index}__].productName}" required>
                                <div th:if="${item.uitem != null}" style="font-size: 12px; color: #666; margin-top: 4px;">
                                    <span th:text="'옵션: ' + ${item.uitem.optionName} + ' - ' + ${item.uitem.optionValue}"></span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">상품코드</label>
                                <input type="text" class="form-control" th:field="*{ordItems[__${iterStat.index}__].productCode}">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">수량 <span class="required">*</span></label>
                                <input type="number" class="form-control" min="1" th:field="*{ordItems[__${iterStat.index}__].quantity}" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">단가 <span class="required">*</span></label>
                                <input type="number" class="form-control" min="0" th:field="*{ordItems[__${iterStat.index}__].unitPrice}" required onchange="calculateTotal()">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button" class="btn btn-remove" onclick="removeItemRow(this)">삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="order-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="section-title" style="margin-bottom: 0;">추가 비용</div>
                    <button type="button" class="btn btn-add" onclick="addFeeRow()">+ 비용 추가</button>
                </div>
                <div id="feesContainer">
                    <div th:each="fee, iterStat : ${ord.orderFees}" class="item-row" th:data-index="${iterStat.index}">
                        <input type="hidden" th:field="*{orderFees[__${iterStat.index}__].id}">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">비용 타입 <span class="required">*</span></label>
                                <select class="form-select" th:field="*{orderFees[__${iterStat.index}__].feeType}" required>
                                    <option value="">선택</option>
                                    <option value="SHIPPING">배송비</option>
                                    <option value="PACKAGING">포장비</option>
                                    <option value="TIP">팁</option>
                                    <option value="ETC">기타</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">비용명 <span class="required">*</span></label>
                                <input type="text" class="form-control" th:field="*{orderFees[__${iterStat.index}__].feeName}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">금액 <span class="required">*</span></label>
                                <input type="number" class="form-control" min="0" th:field="*{orderFees[__${iterStat.index}__].amount}" required onchange="calculateTotal()">
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button" class="btn btn-remove" onclick="removeFeeRow(this)">삭제</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="order-summary">
                <div class="section-title">주문 요약</div>
                <div class="summary-row">
                    <span>상품 금액</span>
                    <span id="itemTotal">0원</span>
                </div>
                <div class="summary-row">
                    <span>추가 비용</span>
                    <span id="feeTotal">0원</span>
                </div>
                <div class="summary-row total">
                    <span>총 결제금액</span>
                    <span id="totalAmount">0원</span>
                </div>
                <button type="submit" class="btn btn-submit">주문하기</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let itemIndex = document.querySelectorAll('#itemsContainer .item-row').length;
        let feeIndex = document.querySelectorAll('#feesContainer .item-row').length;

        function addItemRow() {
            const container = document.getElementById('itemsContainer');
            const newRow = document.createElement('div');
            newRow.className = 'item-row';
            newRow.setAttribute('data-index', itemIndex);
            
            newRow.innerHTML = `
                <input type="hidden" name="ordItems[${itemIndex}].id" value="">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">상품명 <span class="required">*</span></label>
                        <input type="text" class="form-control" name="ordItems[${itemIndex}].productName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">상품코드</label>
                        <input type="text" class="form-control" name="ordItems[${itemIndex}].productCode">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">수량 <span class="required">*</span></label>
                        <input type="number" class="form-control" min="1" name="ordItems[${itemIndex}].quantity" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">단가 <span class="required">*</span></label>
                        <input type="number" class="form-control" min="0" name="ordItems[${itemIndex}].unitPrice" required onchange="calculateTotal()">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-remove" onclick="removeItemRow(this)">삭제</button>
                    </div>
                </div>
            `;
            
            container.appendChild(newRow);
            itemIndex++;
        }

        function removeItemRow(button) {
            const container = document.getElementById('itemsContainer');
            if (container.children.length > 1) {
                button.closest('.item-row').remove();
                calculateTotal();
            } else {
                alert('최소 하나의 상품은 필요합니다.');
            }
        }

        function addFeeRow() {
            const container = document.getElementById('feesContainer');
            const newRow = document.createElement('div');
            newRow.className = 'item-row';
            newRow.setAttribute('data-index', feeIndex);
            
            newRow.innerHTML = `
                <input type="hidden" name="orderFees[${feeIndex}].id" value="">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">비용 타입 <span class="required">*</span></label>
                        <select class="form-select" name="orderFees[${feeIndex}].feeType" required>
                            <option value="">선택</option>
                            <option value="SHIPPING">배송비</option>
                            <option value="PACKAGING">포장비</option>
                            <option value="TIP">팁</option>
                            <option value="ETC">기타</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">비용명 <span class="required">*</span></label>
                        <input type="text" class="form-control" name="orderFees[${feeIndex}].feeName" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">금액 <span class="required">*</span></label>
                        <input type="number" class="form-control" min="0" name="orderFees[${feeIndex}].amount" required onchange="calculateTotal()">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-remove" onclick="removeFeeRow(this)">삭제</button>
                    </div>
                </div>
            `;
            
            container.appendChild(newRow);
            feeIndex++;
        }

        function removeFeeRow(button) {
            button.closest('.item-row').remove();
            calculateTotal();
        }

        function calculateTotal() {
            let itemTotal = 0;
            document.querySelectorAll('#itemsContainer input[name*=".unitPrice"]').forEach((input, index) => {
                const unitPrice = parseFloat(input.value) || 0;
                const quantityInput = document.querySelectorAll('#itemsContainer input[name*=".quantity"]')[index];
                const quantity = parseFloat(quantityInput.value) || 0;
                itemTotal += unitPrice * quantity;
            });

            let feeTotal = 0;
            document.querySelectorAll('#feesContainer input[name*=".amount"]').forEach(input => {
                feeTotal += parseFloat(input.value) || 0;
            });

            const total = itemTotal + feeTotal;

            document.getElementById('itemTotal').textContent = itemTotal.toLocaleString() + '원';
            document.getElementById('feeTotal').textContent = feeTotal.toLocaleString() + '원';
            document.getElementById('totalAmount').textContent = total.toLocaleString() + '원';
        }

        // 페이지 로드 시 계산
        document.addEventListener('DOMContentLoaded', function() {
            calculateTotal();
            // 입력값 변경 시 자동 계산
            document.getElementById('orderForm').addEventListener('input', function(e) {
                if (e.target.name && (e.target.name.includes('.unitPrice') || e.target.name.includes('.quantity') || e.target.name.includes('.amount'))) {
                    calculateTotal();
                }
            });
        });
    </script>
</body>
</html>
