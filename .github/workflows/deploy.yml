name: Deploy to AWS EC2

# 트리거: devlop 브랜치에 푸시가 발생했을 때 실행
on:
  push:
    branches: [ "devlop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote commands via SSH
        # appleboy/ssh-action은 가장 유명한 SSH 접속 플러그인입니다.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 서버에 접속해서 실행할 명령어들
            cd ~
            
            # 스크립트에 실행 권한이 혹시 없을까봐 한 번 더 부여
            chmod +x deploy.sh
            
            # 배포 스크립트 실행
            ./deploy.sh
