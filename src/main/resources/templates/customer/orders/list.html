<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, "Apple SD Gothic Neo", sans-serif;
        }
        .header {
            background-color: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin: 0;
        }
        .order-card {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: box-shadow 0.2s;
        }
        .order-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 15px;
        }
        .order-number {
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }
        .order-date {
            font-size: 14px;
            color: #666;
        }
        .order-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-PENDING { background-color: #fff3cd; color: #856404; }
        .status-CONFIRMED { background-color: #d1ecf1; color: #0c5460; }
        .status-SHIPPED { background-color: #cfe2ff; color: #084298; }
        .status-DELIVERED { background-color: #d1e7dd; color: #0f5132; }
        .status-CANCELLED { background-color: #f8d7da; color: #842029; }
        .order-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .order-amount {
            font-size: 18px;
            font-weight: 700;
            color: #000;
        }
        .btn-view {
            background-color: #fff;
            border: 1px solid #d0d0d0;
            color: #333;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-view:hover {
            background-color: #f8f8f8;
            color: #333;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background-color: #fff;
            border-radius: 8px;
        }
        .empty-state-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .empty-state-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-new-order {
            background-color: #000;
            color: #fff;
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }
        .btn-new-order:hover {
            background-color: #333;
            color: #fff;
        }
        .search-box {
            background-color: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .pagination {
            justify-content: center;
            margin-top: 30px;
        }
        .pagination .page-link {
            color: #333;
            border-color: #e5e5e5;
        }
        .pagination .page-item.active .page-link {
            background-color: #000;
            border-color: #000;
            color: #fff;
        }
        .pagination .page-link:hover {
            background-color: #f8f8f8;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1 class="header-title">주문 내역</h1>
        </div>
    </div>

    <div class="container">
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div></div>
            <a href="/customer/orders/new" class="btn-new-order">주문하기</a>
        </div>

        <div class="search-box">
            <form method="get" action="/customer/orders" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label small">시작일</label>
                    <input type="date" name="startDate" class="form-control form-control-sm" th:value="${startDate}">
                </div>
                <div class="col-md-5">
                    <label class="form-label small">종료일</label>
                    <input type="date" name="endDate" class="form-control form-control-sm" th:value="${endDate}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-secondary btn-sm w-100">검색</button>
                </div>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
            <div class="empty-state-icon">📦</div>
            <div class="empty-state-text">주문 내역이 없습니다.</div>
            <a href="/customer/orders/new" class="btn-new-order">주문하러 가기</a>
        </div>

        <div th:each="order : ${orders}" class="order-card">
            <div class="order-header">
                <div>
                    <div class="order-number" th:text="${order.orderNo}"></div>
                    <div class="order-date" th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <span class="order-status" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
            </div>
            <div class="order-info">
                <div class="order-amount" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                <a th:href="@{/customer/orders/{id}(id=${order.id})}" class="btn-view">상세보기</a>
            </div>
        </div>

        <nav th:if="${totalPages > 1}" aria-label="페이지 네비게이션">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/orders(startDate=${startDate}, endDate=${endDate}, page=${currentPage - 1}, size=${pageSize})}">이전</a>
                </li>
                <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}" 
                    class="page-item" 
                    th:classappend="${pageNum == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/customer/orders(startDate=${startDate}, endDate=${endDate}, page=${pageNum}, size=${pageSize})}" 
                       th:text="${pageNum + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/orders(startDate=${startDate}, endDate=${endDate}, page=${currentPage + 1}, size=${pageSize})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
