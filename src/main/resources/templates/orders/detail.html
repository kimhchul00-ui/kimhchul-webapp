<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-PENDING { background-color: #ffc107; color: #000; }
        .status-CONFIRMED { background-color: #17a2b8; color: #fff; }
        .status-SHIPPED { background-color: #007bff; color: #fff; }
        .status-DELIVERED { background-color: #28a745; color: #fff; }
        .status-CANCELLED { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>주문 상세</h1>
            <div>
                <a th:href="@{/orders/{id}/edit(id=${ord.id})}" class="btn btn-warning">수정</a>
                <a href="/orders" class="btn btn-secondary">목록</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>주문 정보</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <th width="40%">주문번호</th>
                                <td th:text="${ord.orderNo}"></td>
                            </tr>
                            <tr>
                                <th>고객명</th>
                                <td th:text="${ord.customerName}"></td>
                            </tr>
                            <tr>
                                <th>이메일</th>
                                <td th:text="${ord.customerEmail}"></td>
                            </tr>
                            <tr>
                                <th>주문일시</th>
                                <td th:text="${#temporals.format(ord.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            </tr>
                            <tr>
                                <th>상태</th>
                                <td>
                                    <span class="status-badge" th:classappend="'status-' + ${ord.status}" th:text="${ord.status}"></span>
                                </td>
                            </tr>
                            <tr>
                                <th>총 금액</th>
                                <td><strong th:text="${#numbers.formatDecimal(ord.totalAmount, 0, 'COMMA', 0, 'POINT')} + '원'"></strong></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5>배송 정보</h5>
                    </div>
                    <div class="card-body">
                        <p th:text="${ord.shippingAddress}"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5>주문 상품</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>상품명</th>
                            <th>상품코드</th>
                            <th>수량</th>
                            <th>단가</th>
                            <th>합계</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(ord.ordItems)}">
                            <td colspan="5" class="text-center">주문 상품이 없습니다.</td>
                        </tr>
                        <tr th:each="item : ${ord.ordItems}">
                            <td th:text="${item.productName}"></td>
                            <td th:text="${item.productCode}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                            <td th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
